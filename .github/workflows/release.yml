name: Build & Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package .app
        run: ./make-app.sh

      - name: Zip
        run: ditto -c -k --keepParent "TokenFlow.app" "TokenFlow.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenFlow
          path: TokenFlow.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "TokenFlow.zip" \
            --title "${GITHUB_REF_NAME}" --generate-notes
